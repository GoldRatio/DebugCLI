[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harness"
version = "0.1.0"
description = "AI-driven server debugging companion: read-only hardware/software inspection + RAG diagnosis + prioritized human-approved repair actions."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "paramiko>=3.4",
]

[project.optional-dependencies]
docs = [
    "pymupdf>=1.24",
    "tiktoken>=0.6",
    "python-docx>=1.1",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]

[project.scripts]
harness = "harness.operator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
harness = ["**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"